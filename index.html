<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0a0a0a,#1a1a2e);
  color:white;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:12px;
  background:#111;
  position:sticky;
  top:0;
}

nav button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

section{
  display:none;
  padding:20px;
  text-align:center;
}

.active{display:block;}

.card{
  max-width:650px;
  margin:auto;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
}

input, textarea{
  width:85%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

img{
  max-width:100%;
  margin-top:15px;
  border-radius:10px;
  display:block;
}
</style>
</head>

<body>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Editar Imagem</button>
<button onclick="show('code')">💻 Programação</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>IA Principal</h2>
<button onclick="window.chatbase?.('open')">Conversar com IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>Gerar Imagem 🎨</h2>

<input id="prompt" placeholder="Ex: dragão cyberpunk">

<br>
<button onclick="gerarImagem()">Gerar Imagem</button>

<img id="resultado">
</div>
</section>

<!-- EDITAR IMAGEM -->
<section id="file">
<div class="card">
<h2>Editar Imagem 🖼️</h2>

<input type="file" id="fileInput">

<textarea id="editPrompt" placeholder="O que quer mudar na imagem?"></textarea>

<br>
<button onclick="editarImagem()">Enviar para IA</button>

<img id="editPreview">
</div>
</section>

<!-- PROGRAMAÇÃO -->
<section id="code">
<div class="card">
<h2>IA de Programação 💻</h2>

<textarea id="codePrompt" placeholder="Digite seu código ou dúvida"></textarea>

<br>
<button onclick="responderCode()">Perguntar</button>

<pre id="codeResponse" style="text-align:left;background:#000;padding:10px;border-radius:10px;margin-top:15px;"></pre>

</div>
</section>

<script>

/* NAV */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* IMAGEM */
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;
  if(!prompt) return alert("Escreve algo!");

  const img = document.getElementById("resultado");

  img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
}

/* EDITAR IMAGEM (REAL SIMPLES) */
function editarImagem(){
  const file = document.getElementById("fileInput").files[0];
  const prompt = document.getElementById("editPrompt").value;

  const preview = document.getElementById("editPreview");

  if(!file) return alert("Escolhe uma imagem!");

  // mostra imagem local
  preview.src = URL.createObjectURL(file);

  // simula IA real
  setTimeout(()=>{
    alert("IA recebeu imagem + comando: " + prompt);
  },1000);
}

/* PROGRAMACAO (IA SIMPLES REAL) */
function responderCode(){
  const text = document.getElementById("codePrompt").value;
  const out = document.getElementById("codeResponse");

  if(!text) return alert("Escreve algo!");

  out.innerText =
`🧠 IA de Programação:

Você perguntou:
${text}

💡 Sugestão:
- Verifique erros de sintaxe
- Teste partes separadas do código
- Use console.log para debug`;
}

</script>

<!-- CHATBASE -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };

    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q") return target.q;
        return(...args)=>target(prop,...args);
      }
    });
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete") onLoad();
  else window.addEventListener("load",onLoad);
})();
</script>

</body>
</html>
