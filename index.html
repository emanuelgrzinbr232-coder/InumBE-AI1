<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0a0a0a,#1a1a2e);
  color:white;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:12px;
  background:#111;
  position:sticky;
  top:0;
}

nav button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
  transition:0.3s;
}
nav button:hover{
  background:#6366f1;
  transform:scale(1.05);
}

/* SEÇÕES */
section{
  display:none;
  padding:20px;
  text-align:center;
}

.active{display:block;}

.card{
  max-width:650px;
  margin:auto;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* INPUTS */
input, textarea{
  width:80%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

img{
  max-width:100%;
  margin-top:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- MENU -->
<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
</nav>

<!-- CHAT IA -->
<section id="chat" class="active">
<div class="card">
<h2>Chat com IA</h2>
<p>Fale com sua IA abaixo</p>
<button onclick="window.chatbase?.('open')">Abrir Chat IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>Gerador de Imagem 🎨</h2>

<input id="prompt" placeholder="Ex: dragão cyberpunk">

<br>
<button onclick="gerarImagem()">Gerar Imagem</button>

<br>
<img id="resultado">
</div>
</section>

<!-- ARQUIVO (EDITAR IMAGEM) -->
<section id="file">
<div class="card">
<h2>Editar Imagem 🖼️</h2>

<input type="file" accept="image/*">

<textarea placeholder="O que você quer mudar na imagem?"></textarea>

<br>
<button onclick="alert('IA recebeu sua solicitação de edição (simulação).')">
Enviar para IA
</button>

<p style="opacity:0.7">
IA vai interpretar sua imagem + comando (modo simulado)
</p>
</div>
</section>

<!-- PROGRAMAÇÃO -->
<section id="code">
<div class="card">
<h2>Assistente de Programação 💻</h2>

<textarea placeholder="Digite seu problema de código..."></textarea>

<br>
<button onclick="alert('IA de programação aberta (simulação). Use o chat principal para dúvidas.')">
Perguntar
</button>

<pre style="text-align:left;background:#000;padding:10px;border-radius:10px;margin-top:15px;">
console.log("InumBE AI Programação 🚀");
</pre>
</div>
</section>

<script>

/* NAV */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* IMAGEM */
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;

  if(!prompt){
    alert("Escreve algo primeiro!");
    return;
  }

  const img = document.getElementById("resultado");

  // loading visual
  img.src = "https://via.placeholder.com/500x300?text=Gerando+imagem...";
  img.style.display = "block";

  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);

  const teste = new Image();

  teste.onload = () => {
    img.src = url;
  };

  teste.onerror = () => {
    img.src = "https://via.placeholder.com/500x300?text=Erro+na+IA";
  };

  teste.src = url;
}

</script>

<!-- CHATBASE -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };

    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete"){
    onLoad()
  }else{
    window.addEventListener("load",onLoad)
  }
})();
</script>

</body>
</html>
