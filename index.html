<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#050505;
color:white;
overflow-x:hidden;
}

/* FUNDO ANIMADO */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(255,140,0,.25), transparent 25%),
radial-gradient(circle at 80% 40%, rgba(255,100,0,.15), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(255,180,0,.15), transparent 25%);
animation:bgMove 8s ease-in-out infinite alternate;
z-index:-2;
}

@keyframes bgMove{
0%{transform:scale(1);}
100%{transform:scale(1.1);}
}

/* PARTICULAS */
body::after{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(#ff9900 1px, transparent 1px);
background-size:45px 45px;
opacity:.3;
animation:particles 15s linear infinite;
z-index:-1;
}

@keyframes particles{
from{
transform:translateY(0);
}
to{
transform:translateY(45px);
}
}

/* TITULO */
h1{
font-size:50px;
text-align:center;
margin:10px;
color:white;
text-shadow:
0 0 10px #ff8800,
0 0 20px #ff8800,
0 0 40px #ff6600;
animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
from{
transform:scale(1);
}
to{
transform:scale(1.03);
}
}

/* NAV FUTURISTA */
nav{
display:flex;
justify-content:center;
gap:15px;
padding:20px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,136,0,.4);
box-shadow:0 0 25px rgba(255,136,0,.2);
}

/* BOTÕES */
nav button,
button{
background:linear-gradient(135deg,#ff9900,#ff5500);
color:white;
border:none;
border-radius:15px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
box-shadow:0 0 15px rgba(255,136,0,.4);
}

nav button:hover,
button:hover{
transform:translateY(-4px) scale(1.05);
box-shadow:
0 0 20px #ff9900,
0 0 40px #ff6600;
}

/* CARDS */
.card{
max-width:700px;
margin:auto;
padding:30px;
border-radius:25px;
background:rgba(20,20,20,.8);
backdrop-filter:blur(15px);
border:1px solid rgba(255,136,0,.4);
box-shadow:
0 0 20px rgba(255,136,0,.2),
0 0 50px rgba(255,136,0,.15);
animation:cardFloat 5s ease-in-out infinite;
}

@keyframes cardFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
}

/* INPUTS */
input,
textarea{
width:90%;
padding:12px;
border:none;
border-radius:12px;
background:#111;
color:white;
outline:none;
border:1px solid rgba(255,136,0,.4);
}

/* JOGO AFK */
#gameBtn{
  position:fixed;
  bottom:20px;
  right:20px; /* lado direito */
  background:white;
  color:black;
  padding:12px;
  border-radius:50px;
  font-weight:bold;
  cursor:pointer;
  z-index:99999;
}

#gameBox{
background:#111;
border:2px solid #ff8800;
box-shadow:
0 0 20px #ff8800,
0 0 40px rgba(255,136,0,.5);
}

#gameCanvas{
background:#1a1a1a;
border-top:1px solid #ff8800;
}
  /* ===== CELULAR ===== */
@media (max-width: 768px){

h1{
font-size:32px;
margin-top:10px;
}

nav{
flex-wrap:wrap;
gap:8px;
padding:10px;
}

nav button{
font-size:14px;
padding:10px;
}

.card{
width:90%;
padding:20px;
margin:auto;
}

input,
textarea{
width:95%;
}

#gameBox{
width:95%;
left:50%;
transform:translateX(-50%);
bottom:80px;
}

#gameCanvas{
width:100%;
height:180px;
}

#gameBtn{
left:10px;
bottom:10px;
font-size:14px;
padding:10px 14px;
}

section{
padding:15px;
}

button{
font-size:14px;
}

}

/* ===== CELULAR PEQUENO ===== */
@media (max-width: 480px){

h1{
font-size:26px;
}

nav button{
font-size:12px;
padding:8px 10px;
}

.card{
padding:15px;
border-radius:18px;
}

#gameCanvas{
height:160px;
}

}
</style>
</head>

<body>

<h1>⚡ InumBE AI ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>🤖 InumBE AI</h2>
<p>Sua inteligência artificial pessoal</p>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM (ARRUMADO) -->
<section id="img">
<div class="card">
<h2>Gerador de Imagem 🎨</h2>

<input id="prompt" placeholder="Ex: dragão cyberpunk ultra realista">

<br>
<button onclick="gerarImagem()">Criar Imagem</button>

<img id="resultado">
</div>
</section>

<!-- ARQUIVO -->
<section id="file">
<div class="card">
<h2>Arquivo 🖼️</h2>

<input type="file" id="fileInput" accept="image/*">

<img id="preview" style="display:block;margin-top:15px;max-width:100%;border-radius:12px;">
</div>
</section>

<!-- PROGRAMACAO (ARRUMADO) -->
<section id="code">
<div class="card">
<h2>Programação 💻</h2>

<textarea id="codeInput" placeholder="Digite seu problema de código..."></textarea>

<br>
<button onclick="codeHelp()">Analisar</button>

<pre id="codeOut" style="text-align:left;background:#000;padding:12px;border-radius:12px;margin-top:10px;"></pre>
</div>
</section>

<!-- EXTRAS NOVOS -->
<section id="tools">
<div class="card">
<h2>🚀 Ferramentas Extras</h2>

<button onclick="alert('IA ativa 🤖')">Testar IA</button>
<button onclick="alert('Sistema rodando ⚡')">Status</button>
<button onclick="alert('InumBE AI online 🌐')">Servidor</button>

</div>
</section>

<script>

/* TROCAR PÁGINAS */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* IMAGEM (MELHORADO) */
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;

  if(!prompt){
    alert("Escreve algo!");
    return;
  }

  const img = document.getElementById("resultado");
  img.style.display = "block";

  img.src =
  "https://image.pollinations.ai/prompt/" +
  encodeURIComponent(prompt + ", ultra realistic, cinematic, high quality");
}

/* UPLOAD REAL */
document.getElementById("fileInput").addEventListener("change",function(e){
  const file = e.target.files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(ev){
      document.getElementById("preview").src = ev.target.result;
    }

    reader.readAsDataURL(file);
  }
});

/* PROGRAMACAO (MELHORADA) */
function codeHelp(){
  const text = document.getElementById("codeInput").value.toLowerCase();

  let r = "";

  if(text.includes("erro")){
    r = "Verifique o console (F12) e veja a linha do erro.";
  }
  else if(text.includes("html")){
    r = "HTML cria estrutura do site (botões, textos, imagens).";
  }
  else if(text.includes("css")){
    r = "CSS estiliza o site (cores, layout, animações).";
  }
  else if(text.includes("javascript")){
    r = "JavaScript faz o site funcionar com lógica e ações.";
  }
  else if(text.includes("loop")){
    r = "Loop repete ações várias vezes no código.";
  }
  else{
    r = "Explique melhor seu problema de programação.";
  }

  document.getElementById("codeOut").innerText = r;
}

</script>

<!-- CHATBASE (NÃO MEXI) -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };
    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete"){
    onLoad()
  }else{
    window.addEventListener("load",onLoad)
  }
})();
</script>
<!-- BOTÃO -->
<div id="gameBtn" onclick="toggleGame()">🎮 Jogo AFK</div>

<!-- JOGO -->
<div id="gameBox">
  <div id="gameTop">
    <span>⏱️ Tempo: <span id="time">0</span>s</span>
    <button id="closeBtn" onclick="toggleGame()">X</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <p style="color:white;margin:5px">
    📱 Toque na tela para pular • ⌨️ Espaço no PC
  </p>
</div>

<style>
#gameBtn{
  position:fixed;
  bottom:20px;
  background:white;
  color:black;
  padding:12px;
  border-radius:50px;
  font-weight:bold;
  cursor:pointer;
  z-index:99999;
}

#gameBox{
  position:fixed;
  bottom:80px;
  left:20px;
  width:320px;
  background:black;
  border:1px solid white;
  border-radius:10px;
  display:none;
  z-index:99999;
  text-align:center;
}

#gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 10px;
  color:white;
}

#closeBtn{
  background:red;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

#gameCanvas{
  background:#111;
  width:320px;
  height:150px;
}
</style>

<script>
let gameOpen = false;
let canvas, ctx;

let playerY = 120;
let velocity = 0;
let gravity = 0.6;
let jumping = false;

let obstacleX = 320;

let time = 0;
let timerInterval = null;

function toggleGame(){
  gameOpen = !gameOpen;

  document.getElementById("gameBox").style.display =
    gameOpen ? "block" : "none";

  if(gameOpen){
    startGame();
  }else{
    stopGame();
  }
}

function startGame(){

  canvas = document.getElementById("gameCanvas");
  ctx = canvas.getContext("2d");

  canvas.width = 320;
  canvas.height = 150;

  playerY = 120;
  velocity = 0;
  jumping = false;
  obstacleX = 320;

  time = 0;
  document.getElementById("time").innerText = "0";

  clearInterval(timerInterval);

  timerInterval = setInterval(()=>{
    time++;
    document.getElementById("time").innerText = time;
  },1000);

  gameLoop();
}

function stopGame(){
  clearInterval(timerInterval);
}

function jump(){
  if(!jumping){
    velocity = -10;
    jumping = true;
  }
}

// PC
document.addEventListener("keydown",(e)=>{
  if(e.code === "Space"){
    jump();
  }
});

// Celular
document.addEventListener("touchstart",(e)=>{
  if(e.target.id === "gameCanvas"){
    jump();
  }
});

// Clique
document.addEventListener("click",(e)=>{
  if(e.target.id === "gameCanvas"){
    jump();
  }
});

function gameLoop(){

  if(!gameOpen) return;

  ctx.clearRect(0,0,320,150);

  velocity += gravity;
  playerY += velocity;

  if(playerY >= 120){
    playerY = 120;
    velocity = 0;
    jumping = false;
  }

  // Jogador
  ctx.fillStyle = "white";
  ctx.fillRect(50, playerY, 20, 20);

  // Obstáculo
  obstacleX -= 4;

  if(obstacleX < -20){
    obstacleX = 320;
  }

  ctx.fillRect(obstacleX, 120, 20, 20);

  // Colisão
  if(
    obstacleX < 70 &&
    obstacleX + 20 > 50 &&
    playerY > 100
  ){
    alert("Game Over! Tempo: " + time + "s");

    obstacleX = 320;
    time = 0;
    document.getElementById("time").innerText = "0";
  }

  requestAnimationFrame(gameLoop);
}
</script>
