<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000,#fff);
  color:white;
}

/* CONTAINER */
.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

/* TITULO */
h1{
  text-align:center;
  font-size:32px;
  background:linear-gradient(90deg,#fff,#aaa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  padding:20px;
  border-radius:20px;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* INPUTS */
input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}

/* BOTÕES REALISTAS */
button{
  margin-top:10px;
  padding:12px 20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  color:black;
  background:linear-gradient(90deg,#fff,#ddd);
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* IMAGEM */
img{
  max-width:100%;
  margin-top:15px;
  border-radius:12px;
}

/* FILE INPUT */
input[type="file"]{
  background:white;
  color:black;
}
</style>
</head>

<body>

<div class="container">

<h1>InumBE AI PRO 🤖</h1>

<!-- CHAT -->
<div class="card">
<h2>💬 Chat IA</h2>
<textarea id="chatInput" placeholder="Fale com a IA..."></textarea>
<button onclick="chat()">Enviar</button>
<p id="chatOut"></p>
</div>

<!-- IMAGEM -->
<div class="card">
<h2>🎨 Gerador de Imagem</h2>
<input id="imgPrompt" placeholder="Ex: dragão cyberpunk realista">
<button onclick="gerarImagem()">Criar Imagem</button>
<img id="imgOut">
</div>

<!-- VISÃO + EDITAR -->
<div class="card">
<h2>🖼️ IA de Imagem (Editar / Analisar)</h2>

<input type="file" id="file">
<textarea id="imgQuestion" placeholder="O que quer fazer com a imagem?"></textarea>
<button onclick="analisarImagem()">Analisar Imagem</button>

<p id="imgOutText"></p>
</div>

</div>

<script>

const API_KEY = "SUA_API_KEY_AQUI";

/* CHAT */
async function chat(){
  const text = document.getElementById("chatInput").value;

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+API_KEY
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"user",content:text}]
    })
  });

  const data = await res.json();

  document.getElementById("chatOut").innerText =
  data.choices?.[0]?.message?.content || "Erro no chat";
}


/* IMAGEM */
async function gerarImagem(){
  const prompt = document.getElementById("imgPrompt").value;

  const res = await fetch("https://api.openai.com/v1/images/generations", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+API_KEY
    },
    body:JSON.stringify({
      model:"gpt-image-1",
      prompt:prompt,
      size:"1024x1024"
    })
  });

  const data = await res.json();

  console.log(data);

  if(data.data && data.data[0]){
    document.getElementById("imgOut").src = data.data[0].url;
  } else {
    alert("Erro ao gerar imagem");
  }
}


/* VISÃO (EDITAR IMAGEM REAL) */
async function analisarImagem(){

  const file = document.getElementById("file").files[0];
  const question = document.getElementById("imgQuestion").value;

  if(!file) return alert("Escolhe uma imagem!");

  const reader = new FileReader();

  reader.onload = async function(){

    const base64 = reader.result.split(",")[1];

    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+API_KEY
      },
      body:JSON.stringify({
        model:"gpt-4o-mini",
        messages:[
          {
            role:"user",
            content:[
              {type:"text", text: question || "Analise esta imagem"},
              {
                type:"image_url",
                image_url:{
                  url:"data:image/jpeg;base64,"+base64
                }
              }
            ]
          }
        ]
      })
    });

    const data = await res.json();

    document.getElementById("imgOutText").innerText =
    data.choices?.[0]?.message?.content || "Erro na análise";
  }

  reader.readAsDataURL(file);
}

</script>

</body>
</html>
