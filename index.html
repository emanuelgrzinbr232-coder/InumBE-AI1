<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI Premium</title>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
color:white;
min-height:100vh;
overflow-x:hidden;
background:#000;
}

/* 🔥 FUNDO AURA LARANJA + PRETO */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 10% 20%, rgba(255,120,0,.35), transparent 30%),
radial-gradient(circle at 80% 30%, rgba(255,60,0,.25), transparent 35%),
radial-gradient(circle at 50% 80%, rgba(255,160,0,.2), transparent 40%),
linear-gradient(120deg,#000,#0a0a0a,#000);
animation:moveBg 8s infinite alternate;
z-index:-2;
}

@keyframes moveBg{
0%{transform:scale(1) rotate(0deg);}
100%{transform:scale(1.2) rotate(2deg);}
}

/* ⚡ PARTÍCULAS */
body::after{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(rgba(255,140,0,.8) 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
animation:float 20s linear infinite;
z-index:-1;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* 🔥 TÍTULO */
h1{
text-align:center;
padding:20px;
font-size:clamp(30px,5vw,55px);
text-shadow:
0 0 10px orange,
0 0 30px orange,
0 0 60px red;
}

/* NAV */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:15px;
}

/* 🔥 BOTÕES PREMIUM */
button{
background:linear-gradient(135deg,#ff9900,#ff3300);
border:none;
color:white;
padding:12px 18px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
transition:.3s;
box-shadow:0 0 10px rgba(255,100,0,.5);
position:relative;
overflow:hidden;
}

button::before{
content:"";
position:absolute;
inset:-50%;
background:radial-gradient(circle,rgba(255,200,0,.4),transparent);
opacity:0;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 25px orange,0 0 60px red;
}

button:hover::before{
opacity:1;
}

/* CARDS */
section{display:none;padding:20px;text-align:center;}
.active{display:block;}

.card{
width:min(700px,95%);
margin:auto;
padding:20px;
border-radius:20px;
background:rgba(20,20,20,.8);
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(255,100,0,.2);
}

/* INPUTS */
input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

/* IMAGEM */
img{max-width:100%;margin-top:10px;border-radius:10px;}

</style>
</head>

<body>

<h1>⚡ INUMBE AI PREMIUM ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>IA Chat</h2>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🎨 Imagem IA</h2>
<input id="prompt">
<button onclick="imgGen()">Gerar</button>
<img id="outImg">
</div>
</section>

<!-- PROGRAMACAO (IA 1) -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>
<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar</button>
<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS (IA 2) -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>

<textarea id="extraInput"></textarea>

<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>

<pre id="extraOut"></pre>

</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGEM */
function imgGen(){
const p=document.getElementById("prompt").value;
document.getElementById("outImg").src=
"https://image.pollinations.ai/prompt/"+encodeURIComponent(p+", cinematic, orange glow");
}

/* 🔥 ANTI QUEUE FULL */
let lock=false;

/* IA 1 */
async function codeAI(){

if(lock)return;

const text=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

lock=true;
out.innerText="Analisando...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+text)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro IA 1";
}

setTimeout(()=>lock=false,2000);
}

/* IA 2 (OUTRO CANAL PRA NÃO BUGAR) */
async function callAI2(prompt){

try{
const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);
return await r.text();
}catch{
return "Erro IA 2";
}

}

async function translateAI(){
document.getElementById("extraOut").innerText="Traduzindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await callAI2("Traduza para inglês:\n"+t);
}

async function summaryAI(){
document.getElementById("extraOut").innerText="Resumindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await callAI2("Resuma:\n"+t);
}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
