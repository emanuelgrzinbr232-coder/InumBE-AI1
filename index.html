<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InumBE AI</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f0f0f,#1a1a2e);
      color:white;
      text-align:center;
    }

    .box{
      max-width:600px;
      margin:40px auto;
      padding:20px;
      background:rgba(255,255,255,0.05);
      border-radius:20px;
    }

    input{
      padding:10px;
      width:80%;
      border-radius:10px;
      border:none;
      outline:none;
    }

    button{
      padding:10px 20px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      background:#4f46e5;
      color:white;
    }

    button:hover{
      background:#6366f1;
    }

    img{
      margin-top:15px;
      max-width:100%;
      border-radius:10px;
      display:none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>InumBE AI 🤖</h1>
    <p>Chat + Gerador de Imagens</p>

    <hr>

    <h2>Gerador de Imagens 🎨</h2>

    <input id="prompt" type="text" placeholder="Ex: dragão cyberpunk">
    <br>

    <button onclick="gerarImagem()">Gerar imagem</button>

    <img id="resultado">
  </div>

  <script>
    function gerarImagem(){
      const prompt = document.getElementById("prompt").value;

      if(!prompt){
        alert("Escreve algo primeiro!");
        return;
      }

      const img = document.getElementById("resultado");
      img.style.display = "block";

      // API mais estável
      img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
    }
  </script>

  <!-- CHATBASE -->
  <script>
  (function(){
    if(!window.chatbase||window.chatbase("getState")!=="initialized"){
      window.chatbase=(...args)=>{
        if(!window.chatbase.q){window.chatbase.q=[]}
        window.chatbase.q.push(args)
      };

      window.chatbase=new Proxy(window.chatbase,{
        get(target,prop){
          if(prop==="q"){return target.q}
          return(...args)=>target(prop,...args)
        }
      })
    }

    const onLoad=function(){
      const script=document.createElement("script");
      script.src="https://www.chatbase.co/embed.min.js";
      script.id="EEhQiHpWVdyJgwbATfZ6E";
      document.body.appendChild(script);
    }

    if(document.readyState==="complete"){
      onLoad()
    }else{
      window.addEventListener("load",onLoad)
    }
  })();
  </script>

</body>
</html>
