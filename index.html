<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
background:#050505;
color:white;
min-height:100vh;
overflow-x:hidden;
}

h1{
text-align:center;
padding:15px;
text-shadow:0 0 20px orange;
}

nav{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
padding:10px;
background:#111;
}

button{
background:linear-gradient(135deg,#ff9900,#ff5500);
border:none;
color:white;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

section{display:none;padding:20px;text-align:center;}
.active{display:block;}

.card{
width:min(700px,95%);
margin:auto;
padding:20px;
background:#1a1a1a;
border-radius:15px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

img{max-width:100%;margin-top:10px;border-radius:10px;}
</style>
</head>

<body>

<h1>⚡ InumBE AI ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>🤖 IA</h2>
<button onclick="window.chatbase?.('open')">Abrir Chat</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🎨 Imagem</h2>
<input id="prompt">
<button onclick="imgGen()">Gerar</button>
<img id="outImg">
</div>
</section>

<!-- FILE -->
<section id="file">
<div class="card">
<h2>🖼️ Arquivo</h2>
<input type="file" id="fileInput">
<img id="preview">
<button onclick="rotate()">Girar</button>
</div>
</section>

<!-- PROGRAMACAO (IA 1) -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>

<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar Código</button>

<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS (IA 2) -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>

<textarea id="extraInput"></textarea>

<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>

<pre id="extraOut"></pre>
</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGE */
function imgGen(){
const p=document.getElementById("prompt").value;
document.getElementById("outImg").src=
"https://image.pollinations.ai/prompt/"+encodeURIComponent(p+", cinematic");
}

/* FILE */
let rot=0;
document.getElementById("fileInput").addEventListener("change",e=>{
const f=e.target.files[0];
const r=new FileReader();
r.onload=ev=>document.getElementById("preview").src=ev.target.result;
r.readAsDataURL(f);
});

function rotate(){
rot+=90;
document.getElementById("preview").style.transform=`rotate(${rot}deg)`;
}

/* =========================
   🔥 IA 1 - PROGRAMACAO
   ========================= */

let busy1=false;

async function codeAI(){

const text=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

if(!text)return out.innerText="Digite algo";
if(busy1)return;

busy1=true;
out.innerText="Analisando código...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+text)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro IA 1";
}

busy1=false;
}

/* =========================
   🚀 IA 2 - EXTRAS
   (rota diferente pra evitar conflito)
   ========================= */

let busy2=false;

async function callAI2(prompt){

if(busy2) return "⏳ Aguarde IA 2...";
busy2=true;

try{

const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);

return await r.text();

}catch{
return "Erro IA 2";
}finally{
busy2=false;
}

}

async function translateAI(){

const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText="Traduzindo...";

const res=await callAI2("Traduza para inglês:\n"+t);

document.getElementById("extraOut").innerText=res;
}

async function summaryAI(){

const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText="Resumindo...";

const res=await callAI2("Resuma:\n"+t);

document.getElementById("extraOut").innerText=res;
}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
