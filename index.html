<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INUMBE AI</title>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
color:white;
min-height:100vh;
overflow-x:hidden;
background:black;
}

/* 🐉 FUNDO DRAGÃO FORTE (COM FALLBACK) */
body::before{
content:"";
position:fixed;
inset:0;
background:
url("https://image.pollinations.ai/prompt/ultra%20realistic%20dragon%20flying%20in%20storm%20sky,%20cinematic,%204k,%20fire,%20lightning") center/cover no-repeat,
radial-gradient(circle at center, #000, #000);
filter:brightness(1.1) contrast(1.3) saturate(1.4);
z-index:-3;
animation:zoom 10s infinite alternate;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

/* ⚡ RAIO FORTE */
body::after{
content:"";
position:fixed;
inset:0;
background:linear-gradient(115deg,transparent,rgba(255,255,255,.35),transparent);
animation:lightning 2.5s infinite;
z-index:-1;
mix-blend-mode:screen;
}

@keyframes lightning{
0%{transform:translateX(-120%);opacity:0;}
30%{opacity:1;}
100%{transform:translateX(120%);opacity:0;}
}

/* 🔥 AURA LARANJA FORTE */
.glow{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(255,120,0,.45), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(255,40,0,.35), transparent 45%),
radial-gradient(circle at 50% 50%, rgba(255,180,0,.25), transparent 60%);
animation:aura 5s infinite alternate;
z-index:-2;
}

@keyframes aura{
0%{filter:blur(20px);}
100%{filter:blur(45px);}
}

/* TITULO */
h1{
text-align:center;
padding:20px;
font-size:clamp(30px,6vw,60px);
font-weight:900;
letter-spacing:5px;

background:linear-gradient(90deg,#ff6a00,#ffb300,#ff3c00);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 0 20px orange,0 0 40px red;
}

/* MENU */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:15px;
}

/* BOTÕES PREMIUM */
button{
background:linear-gradient(135deg,#ff9900,#ff3300);
border:none;
color:white;
padding:12px 18px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
transition:.3s;
box-shadow:0 0 20px rgba(255,120,0,.5);
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 40px orange,0 0 80px red;
}

/* SEÇÕES */
section{display:none;padding:20px;text-align:center;}
.active{display:block;}

.card{
width:min(700px,95%);
margin:auto;
padding:20px;
background:rgba(0,0,0,.6);
border-radius:20px;
backdrop-filter:blur(12px);
border:1px solid rgba(255,120,0,.3);
}

/* INPUTS */
input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

/* IMAGEM */
img{max-width:100%;margin-top:10px;border-radius:10px;}

</style>
</head>

<body>

<div class="glow"></div>

<h1>INUMBE AI</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>Chat IA</h2>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🐉 Criar Dragão IA</h2>
<input id="prompt" placeholder="ex: dragão de fogo no céu">
<button onclick="imgGen()">Gerar</button>
<img id="imgOut">
</div>
</section>

<!-- PROGRAMACAO -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>
<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar</button>
<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>
<textarea id="extraInput"></textarea>
<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>
<pre id="extraOut"></pre>
</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGEM DRAGÃO */
function imgGen(){
const p=document.getElementById("prompt").value;

document.getElementById("imgOut").src =
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p + ", ultra realistic dragon, cinematic storm, fire, 4k");
}

/* IA PROGRAMACAO */
let lock=false;

async function codeAI(){

if(lock)return;

const t=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

if(!t){out.innerText="Digite algo";return;}

lock=true;
out.innerText="Analisando...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+t)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro IA";
}

setTimeout(()=>lock=false,2000);
}

/* IA EXTRAS */
async function ai(prompt){

const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);

return await r.text();
}

async function translateAI(){
document.getElementById("extraOut").innerText="Traduzindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await ai("Traduza para inglês:\n"+t);
}

async function summaryAI(){
document.getElementById("extraOut").innerText="Resumindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await ai("Resuma:\n"+t);
}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
