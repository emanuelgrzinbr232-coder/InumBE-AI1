<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI ULTRA PRO</title>

<style>

/* ===== FUNDO BILIONÁRIO ===== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
min-height:100vh;
color:white;
overflow-x:hidden;
background:#000;
}

/* AURA LARANJA + PRETO */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 10% 20%, rgba(255,120,0,.35), transparent 30%),
radial-gradient(circle at 90% 30%, rgba(255,60,0,.25), transparent 35%),
radial-gradient(circle at 50% 80%, rgba(255,140,0,.25), transparent 40%),
linear-gradient(120deg,#000,#0a0a0a,#000);
animation:move 8s infinite alternate;
z-index:-2;
}

@keyframes move{
0%{transform:scale(1);}
100%{transform:scale(1.15) rotate(2deg);}
}

/* PARTICULAS */
body::after{
content:"";
position:fixed;
inset:0;
background-image:radial-gradient(rgba(255,140,0,.7) 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
animation:float 18s linear infinite;
z-index:-1;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(80px);}
}

/* TITULO */
h1{
text-align:center;
padding:20px;
font-size:clamp(30px,5vw,55px);
text-shadow:0 0 20px orange,0 0 60px red;
}

/* MENU */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:15px;
}

/* BOTÕES PREMIUM */
button{
background:linear-gradient(135deg,#ff9900,#ff3300);
border:none;
color:white;
padding:12px 18px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
transition:.3s;
box-shadow:0 0 15px rgba(255,120,0,.5);
position:relative;
overflow:hidden;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 30px orange,0 0 80px red;
}

/* SEÇÕES */
section{display:none;padding:20px;text-align:center;}
.active{display:block;}

.card{
width:min(700px,95%);
margin:auto;
padding:20px;
background:rgba(20,20,20,.85);
border-radius:20px;
backdrop-filter:blur(12px);
box-shadow:0 0 40px rgba(255,120,0,.2);
}

/* INPUTS */
input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

/* IMAGENS */
img{max-width:100%;margin-top:10px;border-radius:10px;}

</style>
</head>

<body>

<h1>⚡ INUMBE AI ULTRA PRO ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
<button onclick="show('file')">🖼️ Arquivo</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>Chat IA</h2>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM IA -->
<section id="img">
<div class="card">
<h2>🎨 IA de Imagem</h2>

<input id="prompt" placeholder="Descreva a imagem">

<button onclick="generateImage()">Criar imagem</button>
<button onclick="editImage()">Editar imagem</button>

<img id="imgOut">
</div>
</section>

<!-- PROGRAMACAO (IA 1) -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>

<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar código</button>

<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS (IA 2) -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>

<textarea id="extraInput"></textarea>

<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>

<pre id="extraOut"></pre>
</div>
</section>

<!-- ARQUIVO -->
<section id="file">
<div class="card">
<h2>🖼️ Arquivo IA</h2>

<input type="file" id="fileInput">

<button onclick="editFile()">Editar imagem com IA</button>

<img id="preview">
</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* =========================
   IA 1 - PROGRAMACAO
========================= */
let lock=false;

async function codeAI(){

if(lock) return;

const text=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

out.innerText="Analisando...";
lock=true;

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+text)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro IA programação";
}

setTimeout(()=>lock=false,2000);
}

/* =========================
   IA 2 - EXTRAS
========================= */
async function ai2(prompt){

const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);

return await r.text();
}

async function translateAI(){
document.getElementById("extraOut").innerText="Traduzindo...";
const t=document.getElementById("extraInput").value;

document.getElementById("extraOut").innerText=
await ai2("Traduza para inglês:\n"+t);
}

async function summaryAI(){
document.getElementById("extraOut").innerText="Resumindo...";
const t=document.getElementById("extraInput").value;

document.getElementById("extraOut").innerText=
await ai2("Resuma:\n"+t);
}

/* =========================
   IA 3 - IMAGEM
========================= */

function generateImage(){
const p=document.getElementById("prompt").value;

document.getElementById("imgOut").src=
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p+", ultra realistic cinematic");
}

/* “EDIÇÃO DE IMAGEM” (simulada IA) */
function editImage(){
const p=document.getElementById("prompt").value;

document.getElementById("imgOut").src=
"https://image.pollinations.ai/prompt/" +
encodeURIComponent("edit this image: "+p);
}

/* =========================
   FILE IA (UPLOAD + EDIT)
========================= */

document.getElementById("fileInput").addEventListener("change",e=>{
const file=e.target.files[0];

const r=new FileReader();
r.onload=ev=>{
document.getElementById("preview").src=ev.target.result;
}
r.readAsDataURL(file);
});

function editFile(){

const img=document.getElementById("preview").src;

document.getElementById("preview").src=
"https://image.pollinations.ai/prompt/" +
encodeURIComponent("edit this image, improve quality, cinematic");

}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
