<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0a0a0a,#1a1a2e);
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

img{
  max-width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 InumBE AI PRO</h1>

<!-- CHAT -->
<div class="card">
<h2>💬 Chat IA</h2>
<textarea id="chatInput" placeholder="Fale com a IA..."></textarea>
<button onclick="chat()">Enviar</button>
<p id="chatOut"></p>
</div>

<!-- IMAGEM -->
<div class="card">
<h2>🎨 Gerar Imagem</h2>
<input id="imgPrompt" placeholder="Ex: dragão cyberpunk">
<button onclick="gerarImagem()">Criar imagem</button>
<img id="imgOut">
</div>

<!-- ARQUIVO -->
<div class="card">
<h2>🖼️ Analisar Imagem</h2>
<input type="file" id="file">
<textarea id="imgQuestion" placeholder="O que quer saber da imagem?"></textarea>
<button onclick="analisarImagem()">Enviar</button>
<p id="imgOutText"></p>
</div>

</div>

<script>

const API_KEY = "SUA_API_KEY_AQUI";

/* CHAT */
async function chat(){
  const text = document.getElementById("chatInput").value;

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+API_KEY
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"user",content:text}]
    })
  });

  const data = await res.json();
  document.getElementById("chatOut").innerText =
  data.choices[0].message.content;
}


/* IMAGEM */
async function gerarImagem(){
  const prompt = document.getElementById("imgPrompt").value;

  const res = await fetch("https://api.openai.com/v1/images/generations", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+API_KEY
    },
    body:JSON.stringify({
      model:"gpt-image-1",
      prompt:prompt,
      size:"1024x1024"
    })
  });

  const data = await res.json();

  document.getElementById("imgOut").src =
  data.data[0].url;
}


/* IMAGEM + VISION */
async function analisarImagem(){
  const file = document.getElementById("file").files[0];
  const question = document.getElementById("imgQuestion").value;

  const reader = new FileReader();

  reader.onload = async function(){

    const base64 = reader.result.split(",")[1];

    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+API_KEY
      },
      body:JSON.stringify({
        model:"gpt-4o-mini",
        messages:[
          {
            role:"user",
            content:[
              {type:"text", text:question},
              {
                type:"image_url",
                image_url:{url:"data:image/jpeg;base64,"+base64}
              }
            ]
          }
        ]
      })
    });

    const data = await res.json();

    document.getElementById("imgOutText").innerText =
    data.choices[0].message.content;
  }

  reader.readAsDataURL(file);
}

</script>

</body>
</html>
