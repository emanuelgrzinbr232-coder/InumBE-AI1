<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InumBE AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* FUNDO */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,140,0,.25), transparent 25%),
radial-gradient(circle at 80% 40%, rgba(255,80,0,.15), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(255,180,0,.15), transparent 25%);
animation:bgMove 10s ease-in-out infinite alternate;
z-index:-2;
}

@keyframes bgMove{
0%{transform:scale(1);}
100%{transform:scale(1.1);}
}

/* PARTICULAS */
body::after{
content:"";
position:fixed;
inset:0;
background-image:radial-gradient(#ff9900 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
animation:particles 20s linear infinite;
z-index:-1;
}

@keyframes particles{
from{transform:translateY(0);}
to{transform:translateY(40px);}
}

h1{
text-align:center;
font-size:clamp(30px,5vw,55px);
padding:15px;
text-shadow:0 0 20px orange;
}

nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:12px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(15px);
}

button{
background:linear-gradient(135deg,#ff9900,#ff5500);
border:none;
color:white;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

section{
display:none;
padding:20px;
text-align:center;
}

.active{
display:block;
}

.card{
width:min(700px,95%);
margin:auto;
padding:20px;
background:rgba(20,20,20,.85);
border-radius:20px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

img{
max-width:100%;
margin-top:10px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>⚡ InumBE AI ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>🤖 IA</h2>
<p>Abrir Chatbase</p>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🎨 Imagem</h2>

<input id="prompt" placeholder="Descreva a imagem">

<button onclick="gerarImagem()">Criar</button>
<button onclick="variarImagem()">Variação</button>
<button onclick="baixarImagem()">Baixar</button>

<img id="resultado">
</div>
</section>

<!-- ARQUIVO -->
<section id="file">
<div class="card">
<h2>🖼️ Arquivo</h2>

<input type="file" id="fileInput">

<button onclick="girarImagem()">Girar</button>

<img id="preview">
</div>
</section>

<!-- PROGRAMAÇÃO -->
<section id="code">
<div class="card">

<h2>💻 Programação IA</h2>

<textarea id="codeInput" placeholder="Cole seu código aqui"></textarea>

<button onclick="codeHelp()">Analisar</button>

<pre id="codeOut"></pre>

</div>
</section>

<!-- EXTRAS -->
<section id="tools">
<div class="card">

<h2>🚀 Extras</h2>

<textarea id="extraInput"></textarea>

<button onclick="traduzirTexto()">Traduzir</button>
<button onclick="resumirTexto()">Resumir</button>

<pre id="extraOut"></pre>

</div>
</section>

<script>

/* NAVEGAÇÃO */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGEM */
function gerarImagem(){
const p=document.getElementById("prompt").value;
if(!p) return alert("Escreva algo");

document.getElementById("resultado").src =
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p + ", ultra realistic");
}

function variarImagem(){
const p=document.getElementById("prompt").value;
if(!p) return;

document.getElementById("resultado").src =
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p + ", different version");
}

function baixarImagem(){
const img=document.getElementById("resultado");
if(img.src) window.open(img.src);
}

/* ARQUIVO */
let rot=0;

document.getElementById("fileInput").addEventListener("change",e=>{
const file=e.target.files[0];
if(!file) return;

const r=new FileReader();
r.onload=ev=>document.getElementById("preview").src=ev.target.result;
r.readAsDataURL(file);
});

function girarImagem(){
rot+=90;
document.getElementById("preview").style.transform=`rotate(${rot}deg)`;
}

/* PROGRAMACAO */
let loading=false;

async function codeHelp(){

const text=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

if(!text) return out.innerText="Digite algo";

if(loading) return;

loading=true;
out.innerText="Analisando...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+text)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro";
}

loading=false;
}

/* EXTRAS */
async function traduzirTexto(){
const t=document.getElementById("extraInput").value;

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Traduza para inglês:\n"+t)
);

document.getElementById("extraOut").innerText=await r.text();
}

async function resumirTexto(){
const t=document.getElementById("extraInput").value;

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Resuma:\n"+t)
);

document.getElementById("extraOut").innerText=await r.text();
}

/* CHATBASE */
(function(){
window.chatbase=(...args)=>{(window.chatbase.q=window.chatbase.q||[]).push(args)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();
</script>

</body>
</html>
