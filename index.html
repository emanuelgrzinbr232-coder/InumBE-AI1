<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
color:white;
min-height:100vh;
overflow-x:hidden;

background:
radial-gradient(circle at top,#3b82f620,transparent 40%),
radial-gradient(circle at bottom,#8b5cf620,transparent 40%),
linear-gradient(135deg,#020617,#0f172a,#1e1b4b);

background-size:400% 400%;
animation:bgMove 18s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

body::before{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(#ffffff55 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
pointer-events:none;
z-index:-1;
}

/* TOPO */
.stats{
text-align:center;
padding:12px;
font-weight:bold;
color:#dbeafe;
}

/* LOGO */
h1{
font-size:85px;
font-weight:900;
text-align:center;
margin-top:20px;

background:linear-gradient(
90deg,
#60a5fa,
#8b5cf6,
#60a5fa
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 25px #3b82f6,
0 0 60px #8b5cf6;
}

/* HERO */
.hero{
max-width:1200px;
margin:30px auto;
padding:50px;

text-align:center;

background:rgba(15,23,42,.65);
backdrop-filter:blur(20px);

border-radius:30px;

border:1px solid rgba(139,92,246,.35);

box-shadow:
0 0 40px rgba(59,130,246,.25);
}

.hero h2{
font-size:50px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
opacity:.9;
}

/* MENU */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin:25px;
}

/* BOTÕES */
button{
background:linear-gradient(
135deg,
#2563eb,
#8b5cf6
);

border:none;
padding:14px 24px;

border-radius:15px;

font-size:16px;
font-weight:bold;
color:white;

cursor:pointer;

transition:.3s;

box-shadow:
0 0 20px rgba(99,102,241,.4);
}

button:hover{
transform:translateY(-5px) scale(1.05);

box-shadow:
0 0 35px #3b82f6,
0 0 70px #8b5cf6;
}

/* SEÇÕES */
section{
display:none;
padding:25px;
}

.active{
display:block;
}

/* CARDS */
.card{
max-width:900px;
margin:auto;
padding:30px;

background:rgba(15,23,42,.7);

backdrop-filter:blur(20px);

border-radius:25px;

border:1px solid rgba(59,130,246,.25);

box-shadow:
0 0 25px rgba(59,130,246,.15);
}

/* INPUTS */
input,
textarea{
width:100%;
padding:15px;
margin-top:10px;

border:none;
outline:none;

border-radius:15px;

background:#0f172a;
color:white;
}

/* IMAGENS */
img{
max-width:100%;
margin-top:15px;
border-radius:15px;
}

/* SCROLL */
::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-thumb{
background:#8b5cf6;
border-radius:20px;
}

</style>
<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>Chat IA</h2>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🐉 Criar Dragão IA</h2>
<input id="prompt" placeholder="ex: dragão de fogo no céu">
<button onclick="imgGen()">Gerar</button>
<img id="imgOut">
</div>
</section>

<!-- PROGRAMACAO -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>
<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar</button>
<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>
<textarea id="extraInput"></textarea>
<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>
<pre id="extraOut"></pre>
</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGEM DRAGÃO */
function imgGen(){
const p=document.getElementById("prompt").value;

document.getElementById("imgOut").src =
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p + ", ultra realistic dragon, cinematic storm, fire, 4k");
}

/* IA PROGRAMACAO */
let lock=false;

async function codeAI(){

if(lock)return;

const t=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

if(!t){out.innerText="Digite algo";return;}

lock=true;
out.innerText="Analisando...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+t)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro IA";
}

setTimeout(()=>lock=false,2000);
}

/* IA EXTRAS */
async function ai(prompt){

const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);

return await r.text();
}

async function translateAI(){
document.getElementById("extraOut").innerText="Traduzindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await ai("Traduza para inglês:\n"+t);
}

async function summaryAI(){
document.getElementById("extraOut").innerText="Resumindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await ai("Resuma:\n"+t);
}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
