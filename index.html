<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000,#fff);
  color:white;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  color:black;
  font-weight:bold;
}

img{
  max-width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>InumBE AI 🤖</h1>

<!-- CHAT -->
<div class="card">
<h2>💬 IA</h2>
<textarea id="chatInput" placeholder="Fale com a IA..."></textarea>
<button onclick="chat()">Enviar</button>
<p id="chatOut"></p>
</div>

<!-- IMAGEM -->
<div class="card">
<h2>🎨 Gerador de Imagem</h2>
<input id="imgPrompt" placeholder="Ex: dragão cyberpunk">
<button onclick="gerarImagem()">Criar Imagem</button>
<img id="imgOut">
</div>

<!-- PROGRAMAÇÃO -->
<div class="card">
<h2>💻 Programação</h2>
<textarea id="codeInput" placeholder="Digite sua dúvida de código..."></textarea>
<button onclick="codeHelp()">Perguntar</button>
<p id="codeOut"></p>
</div>

</div>

<script>

/* CHAT SIMPLES */
function chat(){
  const text = document.getElementById("chatInput").value.toLowerCase();

  let resposta = "";

  if(text.includes("oi")){
    resposta = "Olá! Eu sou sua IA 🤖";
  }
  else if(text.includes("imagem")){
    resposta = "Use a aba de imagem 🎨";
  }
  else if(text.includes("programa") || text.includes("código")){
    resposta = "Use a aba de programação 💻";
  }
  else{
    resposta = "Você disse: " + text;
  }

  document.getElementById("chatOut").innerText = resposta;
}


/* IMAGEM */
function gerarImagem(){
  const prompt = document.getElementById("imgPrompt").value;

  if(!prompt){
    alert("Escreve algo!");
    return;
  }

  document.getElementById("imgOut").src =
  "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
}


/* PROGRAMAÇÃO */
function codeHelp(){
  const text = document.getElementById("codeInput").value.toLowerCase();

  let resposta = "";

  if(text.includes("erro")){
    resposta = "Verifique seu código linha por linha e veja o console.";
  }
  else if(text.includes("html")){
    resposta = "HTML é usado para estrutura de páginas.";
  }
  else if(text.includes("javascript")){
    resposta = "JavaScript adiciona interatividade ao site.";
  }
  else{
    resposta = "Explica melhor seu problema de programação.";
  }

  document.getElementById("codeOut").innerText = resposta;
}

</script>

</body>
</html>
