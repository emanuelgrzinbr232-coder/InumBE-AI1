<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* FUNDO ANIMADO */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(255,140,0,.25), transparent 25%),
radial-gradient(circle at 80% 40%, rgba(255,100,0,.15), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(255,180,0,.15), transparent 25%);
animation:bgMove 8s ease-in-out infinite alternate;
z-index:-2;
}

@keyframes bgMove{
0%{transform:scale(1);}
100%{transform:scale(1.1);}
}

body::after{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(#ff9900 1px, transparent 1px);
background-size:45px 45px;
opacity:.3;
animation:particles 15s linear infinite;
z-index:-1;
}

@keyframes particles{
from{transform:translateY(0);}
to{transform:translateY(45px);}
}

/* TITULO */
h1{
font-size:clamp(28px,5vw,50px);
text-align:center;
padding:15px;
text-shadow:
0 0 10px #ff8800,
0 0 20px #ff8800,
0 0 40px #ff6600;
}

/* MENU */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
padding:15px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,136,0,.4);
}

nav button{
background:linear-gradient(135deg,#ff9900,#ff5500);
color:white;
border:none;
border-radius:15px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

nav button:hover{
transform:translateY(-4px);
}

/* SEÇÕES */
section{
display:none;
padding:20px;
text-align:center;
}

.active{
display:block;
}

/* CARDS */
.card{
width:min(700px,95%);
margin:auto;
padding:25px;
border-radius:25px;
background:rgba(20,20,20,.85);
border:1px solid rgba(255,136,0,.4);
backdrop-filter:blur(15px);
box-shadow:
0 0 20px rgba(255,136,0,.2),
0 0 50px rgba(255,136,0,.15);
}

/* INPUTS */
input,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#111;
color:white;
outline:none;
border:1px solid rgba(255,136,0,.4);
margin-top:10px;
}

textarea{
min-height:120px;
resize:vertical;
}

/* BOTÕES */
button{
background:linear-gradient(135deg,#ff9900,#ff5500);
color:white;
border:none;
border-radius:15px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
margin-top:10px;
}

button:hover{
transform:translateY(-3px);
box-shadow:
0 0 20px #ff9900,
0 0 40px #ff6600;
}

/* IMAGENS */
img{
max-width:100%;
border-radius:12px;
margin-top:15px;
}

/* TABLET */
@media (max-width:768px){

h1{
font-size:32px;
}

nav{
gap:8px;
padding:10px;
}

nav button{
font-size:13px;
padding:10px 12px;
}

.card{
width:95%;
padding:18px;
}

section{
padding:15px;
}

}

/* CELULAR */
@media (max-width:480px){

h1{
font-size:26px;
}

nav button{
font-size:12px;
padding:8px 10px;
}

.card{
padding:15px;
border-radius:18px;
}

button{
font-size:13px;
}

}
</style>
</head>

<body>

<h1>⚡ InumBE AI ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>🤖 InumBE AI</h2>
<p>Sua inteligência artificial pessoal</p>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM (ARRUMADO) -->
<section id="img">
<div class="card">
<h2>Gerador de Imagem 🎨</h2>

<input id="prompt" placeholder="Ex: dragão cyberpunk ultra realista">

<br>
<button onclick="gerarImagem()">Criar Imagem</button>

<img id="resultado">
</div>
</section>

<!-- ARQUIVO -->
<section id="file">
<div class="card">
<h2>Arquivo 🖼️</h2>

<input type="file" id="fileInput" accept="image/*">

<img id="preview" style="display:block;margin-top:15px;max-width:100%;border-radius:12px;">
</div>
</section>

<!-- PROGRAMACAO (ARRUMADO) -->
<section id="code">
<div class="card">
<h2>Programação 💻</h2>

<textarea id="codeInput" placeholder="Digite seu problema de código..."></textarea>

<br>
<button onclick="codeHelp()">Analisar</button>

<pre id="codeOut" style="text-align:left;background:#000;padding:12px;border-radius:12px;margin-top:10px;"></pre>
</div>
</section>

<!-- EXTRAS NOVOS -->
<section id="tools">
<div class="card">
<h2>🚀 Ferramentas Extras</h2>

<button onclick="alert('IA ativa 🤖')">Testar IA</button>
<button onclick="alert('Sistema rodando ⚡')">Status</button>
<button onclick="alert('InumBE AI online 🌐')">Servidor</button>

</div>
</section>

<script>

/* TROCAR PÁGINAS */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* IMAGEM (MELHORADO) */
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;

  if(!prompt){
    alert("Escreve algo!");
    return;
  }

  const img = document.getElementById("resultado");
  img.style.display = "block";

  img.src =
  "https://image.pollinations.ai/prompt/" +
  encodeURIComponent(prompt + ", ultra realistic, cinematic, high quality");
}

/* UPLOAD REAL */
document.getElementById("fileInput").addEventListener("change",function(e){
  const file = e.target.files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(ev){
      document.getElementById("preview").src = ev.target.result;
    }

    reader.readAsDataURL(file);
  }
});

/* PROGRAMACAO (MELHORADA) */
function codeHelp(){
  const text = document.getElementById("codeInput").value.toLowerCase();

  let r = "";

  if(text.includes("erro")){
    r = "Verifique o console (F12) e veja a linha do erro.";
  }
  else if(text.includes("html")){
    r = "HTML cria estrutura do site (botões, textos, imagens).";
  }
  else if(text.includes("css")){
    r = "CSS estiliza o site (cores, layout, animações).";
  }
  else if(text.includes("javascript")){
    r = "JavaScript faz o site funcionar com lógica e ações.";
  }
  else if(text.includes("loop")){
    r = "Loop repete ações várias vezes no código.";
  }
  else{
    r = "Explique melhor seu problema de programação.";
  }

  document.getElementById("codeOut").innerText = r;
}

</script>

<!-- CHATBASE (NÃO MEXI) -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };
    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete"){
    onLoad()
  }else{
    window.addEventListener("load",onLoad)
  }
})();
</script>
