<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle at top,#ffffff10,#000000 70%);
  color:white;
}

/* NAV MAIS BONITO */
nav{
  display:flex;
  justify-content:center;
  gap:12px;
  padding:15px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  position:sticky;
  top:0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

nav button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(90deg,#fff,#aaa);
  color:black;
  font-weight:bold;
  transition:0.2s;
}

nav button:hover{
  transform:scale(1.1);
}

/* SEÇÕES */
section{
  display:none;
  padding:25px;
  text-align:center;
}

.active{display:block;}

/* CARD */
.card{
  max-width:650px;
  margin:auto;
  background:rgba(255,255,255,0.06);
  padding:25px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 10px 30px rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);
}

/* INPUTS */
input, textarea{
  padding:12px;
  width:90%;
  border-radius:12px;
  border:none;
  margin-top:10px;
  outline:none;
}

/* BOTÕES */
button{
  padding:10px 20px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(90deg,#fff,#ddd);
  color:black;
  font-weight:bold;
  transition:0.2s;
}

button:hover{
  transform:scale(1.08);
}

/* IMAGEM */
img{
  max-width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

/* TITULO */
h1{
  text-align:center;
  letter-spacing:2px;
  font-size:28px;
}
</style>
</head>

<body>

<h1>⚡ InumBE AI ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>IA Chat</h2>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM (ARRUMADO) -->
<section id="img">
<div class="card">
<h2>Gerador de Imagem 🎨</h2>

<input id="prompt" placeholder="Ex: dragão cyberpunk ultra realista">

<br>
<button onclick="gerarImagem()">Criar Imagem</button>

<img id="resultado">
</div>
</section>

<!-- ARQUIVO -->
<section id="file">
<div class="card">
<h2>Arquivo 🖼️</h2>

<input type="file" id="fileInput" accept="image/*">

<img id="preview" style="display:block;margin-top:15px;max-width:100%;border-radius:12px;">
</div>
</section>

<!-- PROGRAMACAO (ARRUMADO) -->
<section id="code">
<div class="card">
<h2>Programação 💻</h2>

<textarea id="codeInput" placeholder="Digite seu problema de código..."></textarea>

<br>
<button onclick="codeHelp()">Analisar</button>

<pre id="codeOut" style="text-align:left;background:#000;padding:12px;border-radius:12px;margin-top:10px;"></pre>
</div>
</section>

<!-- EXTRAS NOVOS -->
<section id="tools">
<div class="card">
<h2>🚀 Ferramentas Extras</h2>

<button onclick="alert('IA ativa 🤖')">Testar IA</button>
<button onclick="alert('Sistema rodando ⚡')">Status</button>
<button onclick="alert('InumBE AI online 🌐')">Servidor</button>

</div>
</section>

<script>

/* TROCAR PÁGINAS */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* IMAGEM (MELHORADO) */
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;

  if(!prompt){
    alert("Escreve algo!");
    return;
  }

  const img = document.getElementById("resultado");
  img.style.display = "block";

  img.src =
  "https://image.pollinations.ai/prompt/" +
  encodeURIComponent(prompt + ", ultra realistic, cinematic, high quality");
}

/* UPLOAD REAL */
document.getElementById("fileInput").addEventListener("change",function(e){
  const file = e.target.files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(ev){
      document.getElementById("preview").src = ev.target.result;
    }

    reader.readAsDataURL(file);
  }
});

/* PROGRAMACAO (MELHORADA) */
function codeHelp(){
  const text = document.getElementById("codeInput").value.toLowerCase();

  let r = "";

  if(text.includes("erro")){
    r = "Verifique o console (F12) e veja a linha do erro.";
  }
  else if(text.includes("html")){
    r = "HTML cria estrutura do site (botões, textos, imagens).";
  }
  else if(text.includes("css")){
    r = "CSS estiliza o site (cores, layout, animações).";
  }
  else if(text.includes("javascript")){
    r = "JavaScript faz o site funcionar com lógica e ações.";
  }
  else if(text.includes("loop")){
    r = "Loop repete ações várias vezes no código.";
  }
  else{
    r = "Explique melhor seu problema de programação.";
  }

  document.getElementById("codeOut").innerText = r;
}

</script>

<!-- CHATBASE (NÃO MEXI) -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };
    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete"){
    onLoad()
  }else{
    window.addEventListener("load",onLoad)
  }
})();
</script>
<!-- BOTÃO FLUTUANTE (ESQUERDA) -->
<div id="gameBtn" onclick="toggleGame()">🎮 Jogo AFK</div>

<!-- JOGO -->
<div id="gameBox">
  <div id="gameTop">
    <span>⏱️ Tempo: <span id="time">0</span>s</span>
    <button id="closeBtn" onclick="toggleGame()">X</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  <p style="color:white;margin:5px">Espaço para pular</p>
</div>

<style>
#gameBtn{
  position:fixed;
  bottom:20px;
  left:20px;
  background:white;
  color:black;
  padding:12px;
  border-radius:50px;
  font-weight:bold;
  cursor:pointer;
  z-index:9999;
  box-shadow:0 0 10px rgba(255,255,255,0.3);
}

#gameBox{
  position:fixed;
  bottom:80px;
  left:20px;
  width:320px;
  background:black;
  border:1px solid white;
  border-radius:10px;
  display:none;
  z-index:9999;
  text-align:center;
}

#gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 10px;
  color:white;
  font-size:14px;
}

#closeBtn{
  background:red;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  padding:5px 8px;
}

canvas{
  background:#111;
  width:100%;
  height:150px;
}
</style>

<script>

let gameOpen = false;
let canvas, ctx;

let playerY = 120;
let velocity = 0;
let gravity = 0.6;
let jumping = false;

let obstacleX = 300;

// ⏱️ TIMER
let time = 0;
let timerInterval = null;

function toggleGame(){
  gameOpen = !gameOpen;
  document.getElementById("gameBox").style.display = gameOpen ? "block" : "none";

  if(gameOpen){
    startGame();
  }else{
    stopGame();
  }
}

function startGame(){
  canvas = document.getElementById("gameCanvas");
  ctx = canvas.getContext("2d");

  canvas.width = 320;
  canvas.height = 150;

  document.addEventListener("keydown", jump);

  // reset timer
  time = 0;
  document.getElementById("time").innerText = time;

  timerInterval = setInterval(()=>{
    time++;
    document.getElementById("time").innerText = time;
  },1000);

  gameLoop();
}

function stopGame(){
  clearInterval(timerInterval);
  document.removeEventListener("keydown", jump);
}

function jump(e){
  if(e.code === "Space" && !jumping){
    velocity = -10;
    jumping = true;
  }
}

function gameLoop(){
  if(!gameOpen) return;

  ctx.clearRect(0,0,320,150);

  // player
  velocity += gravity;
  playerY += velocity;

  if(playerY >= 120){
    playerY = 120;
    velocity = 0;
    jumping = false;
  }

  ctx.fillStyle = "white";
  ctx.fillRect(50, playerY, 20, 20);

  // obstacle
  obstacleX -= 4;
  if(obstacleX < -20){
    obstacleX = 320;
  }

  ctx.fillRect(obstacleX, 120, 20, 20);

  // colisão
  if(obstacleX < 70 && obstacleX > 40 && playerY >= 100){
    alert("Game Over! Tempo: " + time + "s");
    obstacleX = 320;
    time = 0;
  }

  requestAnimationFrame(gameLoop);
}

</script>
</body>
</html>
