<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f0f0f,#1a1a2e);
  color:white;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  background:#111;
  position:sticky;
  top:0;
}

nav button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

section{
  display:none;
  padding:20px;
  text-align:center;
}

.active{
  display:block;
}

.card{
  max-width:600px;
  margin:auto;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
}

input{
  padding:10px;
  width:80%;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

button{
  padding:10px 20px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

img{
  max-width:100%;
  margin-top:15px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>Conversar com IA</h2>
<p>Abra o chat abaixo</p>
<button onclick="window.chatbase?.('open')">Falar com IA</button>
</div>
</section>

<!-- IMAGEM TEXTO -->
<section id="img">
<div class="card">
<h2>Gerar Imagem 🎨</h2>

<input id="prompt" placeholder="Ex: dragão cyberpunk">
<br>
<button onclick="gerarImagem()">Gerar</button>

<img id="resultado">
</div>
</section>

<!-- ARQUIVO -->
<section id="file">
<div class="card">
<h2>Imagem por Arquivo 🖼️</h2>

<p>Escolha uma imagem (simulação visual)</p>
<input type="file" accept="image/*">

<p style="opacity:0.7">
⚠️ (versão demo — futuramente podemos ligar IA real de análise de imagem)
</p>
</div>
</section>

<!-- PROGRAMACAO -->
<section id="code">
<div class="card">
<h2>Programação 💻</h2>
<p>Exemplo de código:</p>

<pre style="text-align:left;background:#000;padding:10px;border-radius:10px;">
console.log("InumBE AI rodando 🚀");
</pre>

</div>
</section>

<script>
// trocar páginas
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// gerar imagem
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;
  if(!prompt){ alert("Escreve algo!"); return; }

  const img = document.getElementById("resultado");
  img.style.display = "block";
  img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
}
</script>

<!-- CHATBASE -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };
    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete"){
    onLoad()
  }else{
    window.addEventListener("load",onLoad)
  }
})();
</script>

</body>
</html>
