<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000,#fff);
  color:white;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  margin-top:20px;
  box-shadow:0 10px 20px rgba(0,0,0,0.5);
}

input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  outline:none;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  color:black;
  font-weight:bold;
}

img{
  max-width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>InumBE AI 🤖 (Offline)</h1>

<!-- CHAT -->
<div class="card">
<h2>💬 Chat IA</h2>
<textarea id="chatInput" placeholder="Fale com a IA..."></textarea>
<button onclick="chat()">Enviar</button>
<p id="chatOut"></p>
</div>

<!-- IMAGEM -->
<div class="card">
<h2>🎨 Gerador de Imagem</h2>
<input id="imgPrompt" placeholder="Ex: dragão cyberpunk">
<button onclick="gerarImagem()">Gerar Imagem</button>
<img id="imgOut">
</div>

<!-- IMAGEM + UPLOAD -->
<div class="card">
<h2>🖼️ Analisar Imagem (simulado)</h2>
<input type="file" id="file">
<textarea id="imgQuestion" placeholder="O que quer fazer com a imagem?"></textarea>
<button onclick="analisarImagem()">Enviar</button>
<p id="imgOutText"></p>
</div>

</div>

<script>

/* CHAT SIMULADO */
function chat(){
  const text = document.getElementById("chatInput").value.toLowerCase();

  let resposta = "";

  if(text.includes("oi") || text.includes("olá")){
    resposta = "Olá! Eu sou a InumBE AI 🤖 Como posso te ajudar?";
  }
  else if(text.includes("imagem")){
    resposta = "Vá na aba de imagem para gerar uma criação 🎨";
  }
  else if(text.includes("programa") || text.includes("código")){
    resposta = "Eu posso te ajudar com lógica e programação básica 💻";
  }
  else if(text.includes("quem é você")){
    resposta = "Sou uma IA offline criada para te ajudar no navegador 🤖";
  }
  else{
    resposta = "Entendi sua mensagem: " + text;
  }

  document.getElementById("chatOut").innerText = resposta;
}


/* IMAGEM */
function gerarImagem(){
  const prompt = document.getElementById("imgPrompt").value;

  if(!prompt){
    alert("Escreve algo!");
    return;
  }

  const img = document.getElementById("imgOut");

  // geração simples por link (sem API)
  img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
}


/* ANALISAR IMAGEM (SIMULADO) */
function analisarImagem(){
  const file = document.getElementById("file").files[0];
  const text = document.getElementById("imgQuestion").value;

  if(!file){
    alert("Escolhe uma imagem!");
    return;
  }

  document.getElementById("imgOutText").innerText =
  "IA recebeu sua imagem e comando: '" + text + "' (modo offline simulado)";
}

</script>

</body>
</html>
