<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InumBE AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      <hr>

<h2>Gerador de Imagens 🎨</h2>

<input id="prompt" type="text" placeholder="Descreva a imagem..." style="padding:10px;width:80%;max-width:400px;">
<br><br>

<button onclick="gerarImagem()" style="padding:10px 20px;cursor:pointer;">
Gerar imagem
</button>

<br><br>

<img id="resultado" style="max-width:90%;border-radius:10px;display:none;" />
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .btn {
      background: #4f46e5;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #6366f1;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>InumBE AI 🤖</h1>
    <p>Seu assistente inteligente está pronto para conversar</p>
    <button class="btn" onclick="openChat()">Falar com a IA</button>
  </div>

  <script>
    function openChat(){
      // força abrir o chat do Chatbase
      window.chatbase?.("open");
    }

    (function(){
      if(!window.chatbase||window.chatbase("getState")!=="initialized"){
        window.chatbase=(...args)=>{
          if(!window.chatbase.q){window.chatbase.q=[]}
          window.chatbase.q.push(args)
        };

        window.chatbase=new Proxy(window.chatbase,{
          get(target,prop){
            if(prop==="q"){return target.q}
            return(...args)=>target(prop,...args)
          }
        })
      }

      const onLoad=function(){
        const script=document.createElement("script");
        script.src="https://www.chatbase.co/embed.min.js";
        script.id="EEhQiHpWVdyJgwbATfZ6E";
        document.body.appendChild(script);
      }

      if(document.readyState==="complete"){
        onLoad()
      }else{
        window.addEventListener("load",onLoad)
      }
    })();
  </script>

</body>
</html>
