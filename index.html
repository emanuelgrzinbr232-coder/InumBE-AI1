<style>
body{
margin:0;
font-family:Arial,sans-serif;
color:white;
min-height:100vh;
overflow-x:hidden;

background:
linear-gradient(
135deg,
#050816,
#0f172a,
#1e1b4b,
#4c1d95
);

background-size:400% 400%;
animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
/* RESET */
.hero{
max-width:900px;
margin:20px auto;
padding:40px;
text-align:center;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

border-radius:25px;
}
@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}
@keyframes lightning{
0%{transform:translateX(-120%);opacity:0;}
30%{opacity:1;}
100%{transform:translateX(120%);opacity:0;}
}
@keyframes aura{
0%{filter:blur(20px);}
100%{filter:blur(45px);}
}

/* TITULO */
h1{
font-size:70px;
font-weight:900;
text-align:center;

background:
linear-gradient(
90deg,
#3b82f6,
#8b5cf6,
#3b82f6
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 20px #3b82f6,
0 0 50px #8b5cf6;
}

/* MENU */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:15px;
}

/* BOTÕES PREMIUM */
button{
background:linear-gradient(135deg,#ff9900,#ff3300);
border:none;
color:white;
padding:12px 18px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
transition:.3s;
box-shadow:0 0 20px rgba(255,120,0,.5);
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 40px orange,0 0 80px red;
}

/* SEÇÕES */
section{display:none;padding:20px;text-align:center;}
.active{display:block;}

.card{
max-width:700px;
margin:auto;
padding:25px;

background:
rgba(15,23,42,.75);

border-radius:25px;

border:
1px solid rgba(59,130,246,.3);

backdrop-filter:
blur(20px);
}
.sections{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
}

/* INPUTS */
input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

/* IMAGEM */
img{max-width:100%;margin-top:10px;border-radius:10px;}

</style>
</head>

<body>

<div class="glow"></div>

<div class="hero">
<h2>A IA mais poderosa do InumBE</h2>
<p>Converse, programe, gere imagens e muito mais.</p>
<button onclick="window.chatbase?.('open')">
🚀 Começar Agora
</button>
</div>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>Chat IA</h2>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🐉 Criar Dragão IA</h2>
<input id="prompt" placeholder="ex: dragão de fogo no céu">
<button onclick="imgGen()">Gerar</button>
<img id="imgOut">
</div>
</section>

<!-- PROGRAMACAO -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>
<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar</button>
<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>
<textarea id="extraInput"></textarea>
<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>
<pre id="extraOut"></pre>
</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGEM DRAGÃO */
function imgGen(){
const p=document.getElementById("prompt").value;

document.getElementById("imgOut").src =
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p + ", ultra realistic dragon, cinematic storm, fire, 4k");
}

/* IA PROGRAMACAO */
let lock=false;

async function codeAI(){

if(lock)return;

const t=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

if(!t){out.innerText="Digite algo";return;}

lock=true;
out.innerText="Analisando...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+t)
);

out.innerText=await r.text();

}catch{
out.innerText="Erro IA";
}

setTimeout(()=>lock=false,2000);
}

/* IA EXTRAS */
async function ai(prompt){

const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);

return await r.text();
}

async function translateAI(){
document.getElementById("extraOut").innerText="Traduzindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await ai("Traduza para inglês:\n"+t);
}

async function summaryAI(){
document.getElementById("extraOut").innerText="Resumindo...";
const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText=
await ai("Resuma:\n"+t);
}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
