<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InumBE AI PRO</title>

<style>

/* ===== FUNDO PREMIUM ===== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
min-height:100vh;
color:white;
overflow-x:hidden;
background:#000;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,120,0,.35), transparent 35%),
radial-gradient(circle at 80% 30%, rgba(255,60,0,.25), transparent 40%),
radial-gradient(circle at 50% 80%, rgba(255,160,0,.25), transparent 40%),
linear-gradient(120deg,#000,#0a0a0a,#000);
animation:move 8s infinite alternate;
z-index:-2;
}

@keyframes move{
0%{transform:scale(1);}
100%{transform:scale(1.15) rotate(2deg);}
}

/* partículas */
body::after{
content:"";
position:fixed;
inset:0;
background-image:radial-gradient(rgba(255,140,0,.8) 1px, transparent 1px);
background-size:40px 40px;
opacity:.2;
animation:float 18s linear infinite;
z-index:-1;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* título */
h1{
text-align:center;
padding:20px;
font-size:clamp(28px,5vw,50px);
text-shadow:0 0 20px orange,0 0 40px red;
}

/* botões */
nav{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
padding:10px;
}

button{
background:linear-gradient(135deg,#ff9900,#ff3300);
border:none;
color:white;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
transition:.3s;
box-shadow:0 0 10px rgba(255,100,0,.5);
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 25px orange,0 0 60px red;
}

/* sections */
section{display:none;padding:20px;text-align:center;}
.active{display:block;}

.card{
width:min(700px,95%);
margin:auto;
padding:20px;
background:rgba(20,20,20,.85);
border-radius:20px;
backdrop-filter:blur(10px);
}

/* inputs */
input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

img{max-width:100%;margin-top:10px;border-radius:10px;}

</style>
</head>

<body>

<h1>⚡ INUMBE AI PRO ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>Chat IA</h2>
<button onclick="window.chatbase?.('open')">Abrir Chat</button>
</div>
</section>

<!-- IMAGEM -->
<section id="img">
<div class="card">
<h2>🎨 Imagem IA</h2>
<input id="prompt">
<button onclick="imgGen()">Gerar</button>
<img id="imgOut">
</div>
</section>

<!-- PROGRAMAÇÃO (IA 1) -->
<section id="code">
<div class="card">
<h2>💻 Programação IA</h2>
<textarea id="codeInput"></textarea>
<button onclick="codeAI()">Analisar Código</button>
<pre id="codeOut"></pre>
</div>
</section>

<!-- EXTRAS (IA 2) -->
<section id="tools">
<div class="card">
<h2>🚀 Extras IA</h2>

<textarea id="extraInput"></textarea>

<button onclick="translateAI()">Traduzir</button>
<button onclick="summaryAI()">Resumir</button>

<pre id="extraOut"></pre>

</div>
</section>

<script>

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* IMAGEM */
function imgGen(){
const p=document.getElementById("prompt").value;

document.getElementById("imgOut").src =
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(p + ", cinematic orange glow");
}

/* =========================
   🔥 CONTROLE ANTI QUEUE
   ========================= */

let lock=false;

/* IA 1 - PROGRAMACAO */
async function codeAI(){

if(lock) return;

const text=document.getElementById("codeInput").value;
const out=document.getElementById("codeOut");

if(!text){
out.innerText="Digite algo";
return;
}

lock=true;
out.innerText="Analisando...";

try{

const r=await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent("Explique o código:\n\n"+text)
);

const res=await r.text();

/* se der erro de fila → fallback IA 2 */
if(res.includes("Queue full") || res.includes("error")){
throw new Error("fallback");
}

out.innerText=res;

}catch{

out.innerText="Usando IA alternativa...";

const r2=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent("Explique o código:\n\n"+text)
);

out.innerText=await r2.text();

}

setTimeout(()=>lock=false,2500);
}

/* IA 2 - EXTRAS */
async function callAI(prompt){

try{
const r=await fetch(
"https://text.pollinations.ai/model/openai/" +
encodeURIComponent(prompt)
);
return await r.text();
}catch{
return "Erro IA";
}

}

async function translateAI(){

const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText="Traduzindo...";

document.getElementById("extraOut").innerText=
await callAI("Traduza para inglês:\n"+t);
}

async function summaryAI(){

const t=document.getElementById("extraInput").value;
document.getElementById("extraOut").innerText="Resumindo...";

document.getElementById("extraOut").innerText=
await callAI("Resuma:\n"+t);
}

/* CHATBASE */
(function(){
window.chatbase=(...a)=>{(window.chatbase.q=window.chatbase.q||[]).push(a)};
const s=document.createElement("script");
s.src="https://www.chatbase.co/embed.min.js";
s.id="EEhQiHpWVdyJgwbATfZ6E";
document.body.appendChild(s);
})();

</script>

</body>
</html>
