<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* FUNDO PREMIUM */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,140,0,.25), transparent 25%),
radial-gradient(circle at 80% 40%, rgba(255,80,0,.15), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(255,180,0,.15), transparent 25%);
animation:bgMove 10s ease-in-out infinite alternate;
z-index:-2;
}

@keyframes bgMove{
0%{transform:scale(1);}
100%{transform:scale(1.1);}
}

/* PARTICULAS */
body::after{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(#ff9900 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
animation:particles 20s linear infinite;
z-index:-1;
}

@keyframes particles{
from{transform:translateY(0);}
to{transform:translateY(40px);}
}

/* LOGO */
h1{
text-align:center;
font-size:clamp(30px,5vw,55px);
padding:15px;
letter-spacing:3px;
text-shadow:
0 0 10px #ff8800,
0 0 20px #ff8800,
0 0 40px #ff6600;
}

/* MENU */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:12px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,136,0,.3);
}

/* BOTÕES */
nav button,
button{
background:linear-gradient(135deg,#ff9900,#ff5500);
border:none;
color:white;
padding:12px 18px;
border-radius:15px;
font-weight:bold;
cursor:pointer;
transition:.3s;
box-shadow:0 0 15px rgba(255,136,0,.3);
}

nav button:hover,
button:hover{
transform:translateY(-3px) scale(1.05);
box-shadow:
0 0 20px #ff9900,
0 0 40px #ff6600;
}

/* SEÇÕES */
section{
display:none;
padding:20px;
text-align:center;
}

.active{
display:block;
}

/* CARDS */
.card{
width:min(700px,95%);
margin:auto;
padding:25px;
border-radius:25px;
background:rgba(20,20,20,.85);
backdrop-filter:blur(15px);
border:1px solid rgba(255,136,0,.4);
box-shadow:
0 0 20px rgba(255,136,0,.2),
0 0 50px rgba(255,136,0,.15);
}

/* INPUTS */
input,
textarea{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
color:white;
border-radius:12px;
border:1px solid rgba(255,136,0,.4);
outline:none;
}

/* IMAGENS */
img{
max-width:100%;
border-radius:12px;
margin-top:15px;
}

/* CELULAR */
@media(max-width:768px){

h1{
font-size:28px;
}

nav{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

nav button{
font-size:12px;
padding:10px;
}

.card{
width:98%;
padding:15px;
}

input,
textarea{
font-size:14px;
}

button{
font-size:13px;
}

h2{
font-size:18px;
}
}
</style>
</head>

<body>

<h1>⚡ InumBE AI ⚡</h1>

<nav>
<button onclick="show('chat')">🤖 IA</button>
<button onclick="show('img')">🎨 Imagem</button>
<button onclick="show('file')">🖼️ Arquivo</button>
<button onclick="show('code')">💻 Programação</button>
<button onclick="show('tools')">🚀 Extras</button>
</nav>

<!-- CHAT -->
<section id="chat" class="active">
<div class="card">
<h2>🤖 InumBE AI</h2>
<p>Sua inteligência artificial pessoal</p>
<button onclick="window.chatbase?.('open')">Abrir IA</button>
</div>
</section>
<section id="img">
<div class="card">
<h2>🎨 Gerador de Imagem</h2>

<input id="prompt" placeholder="Descreva a imagem">

<button onclick="gerarImagem()">Criar</button>
<button onclick="variarImagem()">Variação</button>
<button onclick="baixarImagem()">Baixar</button>

<img id="resultado" style="display:none;">
</div>
</section>
<section id="file">
<div class="card">
--Arquivo--
<h2>🖼️ Editor de Arquivos</h2>

<input type="file" id="fileInput" accept="image/*">

<button onclick="girarImagem()">Girar</button>

<img id="preview">

</div>
</section>

<!-- PROGRAMACAO (ARRUMADO) --

<!-- EXTRAS NOVOS -->
<section id="tools">
<div class="card">

<h2>🚀 Ferramentas IA</h2>

<textarea id="extraInput"
placeholder="Digite algo"></textarea>

<button onclick="traduzirTexto()">
Traduzir
</button>

<button onclick="resumirTexto()">
Resumir
</button>

<pre id="extraOut"></pre>

</div>
</section>
<script>

/* TROCAR PÁGINAS */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* IMAGEM (MELHORADO) */
function gerarImagem(){
  const prompt = document.getElementById("prompt").value;

  if(!prompt){
    alert("Escreve algo!");
    return;
  }

  const img = document.getElementById("resultado");
  img.style.display = "block";

  img.src =
  "https://image.pollinations.ai/prompt/" +
  encodeURIComponent(prompt + ", ultra realistic, cinematic, high quality");
}

/* UPLOAD REAL */
document.getElementById("fileInput").addEventListener("change",function(e){
  const file = e.target.files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(ev){
      document.getElementById("preview").src = ev.target.result;
    }

    reader.readAsDataURL(file);
  }
});

/* PROGRAMACAO (MELHORADA) */
function codeHelp(){
  const text = document.getElementById("codeInput").value.toLowerCase();

  let r = "";

  if(text.includes("erro")){
    r = "Verifique o console (F12) e veja a linha do erro.";
  }
  else if(text.includes("html")){
    r = "HTML cria estrutura do site (botões, textos, imagens).";
  }
  else if(text.includes("css")){
    r = "CSS estiliza o site (cores, layout, animações).";
  }
  else if(text.includes("javascript")){
    r = "JavaScript faz o site funcionar com lógica e ações.";
  }
  else if(text.includes("loop")){
    r = "Loop repete ações várias vezes no código.";
  }
  else{
    r = "Explique melhor seu problema de programação.";
  }

  document.getElementById("codeOut").innerText = r;
}

</script>

<!-- CHATBASE (NÃO MEXI) -->
<script>
(function(){
  if(!window.chatbase||window.chatbase("getState")!=="initialized"){
    window.chatbase=(...args)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(args)
    };
    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }

  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="EEhQiHpWVdyJgwbATfZ6E";
    document.body.appendChild(script);
  }

  if(document.readyState==="complete"){
    onLoad()
  }else{
    window.addEventListener("load",onLoad)
  }
})();
  function gerarImagem(){
const prompt=document.getElementById("prompt").value;

if(!prompt){
alert("Digite uma descrição");
return;
}

const img=document.getElementById("resultado");

img.style.display="block";

img.src=
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(prompt + ", ultra realistic");
}

function variarImagem(){
const prompt=document.getElementById("prompt").value;

if(!prompt) return;

document.getElementById("resultado").src=
"https://image.pollinations.ai/prompt/" +
encodeURIComponent(prompt + ", different version");
}

function baixarImagem(){
const img=document.getElementById("resultado");

if(!img.src) return;

window.open(img.src,"_blank");
}
  let rotacao = 0;

document.getElementById("fileInput")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(ev){
document.getElementById("preview").src=ev.target.result;
}

reader.readAsDataURL(file);

});

function girarImagem(){
rotacao += 90;

document.getElementById("preview")
.style.transform=
`rotate(${rotacao}deg)`;
}
  async function codeHelp(){

const text=
document.getElementById("codeInput").value;

if(!text){
return;
}

document.getElementById("codeOut")
.innerText="Analisando...";

try{

const resposta=
await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent(
"Explique este código:\n\n" + text
)
);

const resultado=
await resposta.text();

document.getElementById("codeOut")
.innerText=resultado;

}catch{

document.getElementById("codeOut")
.innerText="Erro ao analisar.";

}

}
  async function traduzirTexto(){

const texto=
document.getElementById("extraInput").value;

const r=
await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent(
"Traduza para inglês:\n" + texto
)
);

document.getElementById("extraOut")
.innerText=
await r.text();

}

async function resumirTexto(){

const texto=
document.getElementById("extraInput").value;

const r=
await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent(
"Resuma este texto:\n" + texto
)
);

document.getElementById("extraOut")
.innerText=
await r.text();

}
</script>
